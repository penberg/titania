[workspace]
members = ["cli", "compiler", "gpu", "model", "simulator"]
resolver = "3"

# The forward pass is unusably slow unoptimized, on the CPU and in the
# simulator alike, so optimize both even in debug builds.
[profile.dev.package.titania-model]
opt-level = 3

[profile.dev.package.titania-simulator]
opt-level = 3
