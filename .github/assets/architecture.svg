<svg xmlns="http://www.w3.org/2000/svg" width="700" height="520" viewBox="0 0 700 520" role="img" aria-labelledby="title desc">
  <title id="title">Titania architecture</title>
  <desc id="desc">The model, a transformer, is compiled to the Titania ISA. The GPU, an RTL design, executes the ISA and is synthesized to an FPGA and then an ASIC. The ISA simulator defines the semantics of the ISA, and the GPU is verified against it.</desc>
  <style>
    /* Titania's palette is the moon in the hero image: the night side, the
       lit edge, and the day side. */
    svg {
      --night: #011812;
      --deep: #144e3a;
      --moon: #3ec98a;
      --cream: #fdf9de;

      --fg: var(--night);
      --muted: #3a5b4c;
      --line: #9dbfae;
      --edge: #3a5b4c;
      --box: var(--cream);
      --box-stroke: var(--deep);
      --isa: var(--moon);
      --isa-stroke: var(--deep);
      --isa-fg: var(--night);
      --isa-muted: var(--night);
      --sim: var(--deep);
      --sim-stroke: var(--deep);
      --sim-fg: var(--cream);
      --sim-muted: #a9e6c8;
      --accent: var(--moon);
      --accent-label: #1f8a5c;
    }
    @media (prefers-color-scheme: dark) {
      svg {
        --fg: var(--cream);
        --muted: #9ecbb4;
        --line: #2a6b50;
        --edge: #9ecbb4;
        --box: var(--night);
        --box-stroke: #2a6b50;
        --isa-stroke: var(--moon);
        --sim-stroke: var(--moon);
        --accent-label: var(--moon);
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .box { fill: var(--box); stroke: var(--box-stroke); stroke-width: 2; }
    .isa { fill: var(--isa); stroke: var(--isa-stroke); stroke-width: 2; }
    .sim { fill: var(--sim); stroke: var(--sim-stroke); stroke-width: 2; }
    .title { fill: var(--fg); font-size: 20px; font-weight: 700; text-anchor: middle; }
    .sub { fill: var(--muted); font-size: 15px; text-anchor: middle; }
    .isa .title, .isa-text .title { fill: var(--isa-fg); }
    .isa-text .sub { fill: var(--isa-muted); }
    .sim-text .title { fill: var(--sim-fg); }
    .sim-text .sub { fill: var(--sim-muted); }
    .pill { fill: var(--fg); font-size: 17px; font-weight: 700; text-anchor: middle; }
    .edge { fill: none; stroke: var(--edge); stroke-width: 2; }
    .edge-sim { fill: none; stroke: var(--accent); stroke-width: 2; }
    .dashed { stroke-dasharray: 6 5; }
    .head { fill: var(--edge); }
    .head-sim { fill: var(--accent); }
    .label { fill: var(--muted); font-size: 14px; }
    .label-sim { fill: var(--accent-label); font-size: 14px; }
    .divider { stroke: var(--line); stroke-width: 1.5; stroke-dasharray: 2 5; }
    .zone { fill: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: 2px; text-anchor: end; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 L2.5,5 Z"/>
    </marker>
    <marker id="arrow-sim" viewBox="0 0 10 10" refX="10" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse">
      <path class="head-sim" d="M0,0 L10,5 L0,10 L2.5,5 Z"/>
    </marker>
  </defs>

  <!-- Software / hardware boundary -->
  <line class="divider" x1="40" y1="272" x2="660" y2="272"/>
  <text class="zone" x="660" y="262">SOFTWARE</text>
  <text class="zone" x="660" y="292">HARDWARE</text>

  <!-- Edges -->
  <line class="edge" x1="150" y1="100" x2="150" y2="155" marker-end="url(#arrow)"/>
  <text class="label mono" x="164" y="133">compile</text>

  <line class="edge" x1="150" y1="232" x2="150" y2="311" marker-end="url(#arrow)"/>
  <text class="label mono" x="164" y="258">execute</text>

  <line class="edge" x1="150" y1="388" x2="150" y2="443" marker-end="url(#arrow)"/>
  <text class="label mono" x="164" y="421">synthesize</text>

  <line class="edge" x1="205" y1="469" x2="244" y2="469" marker-end="url(#arrow)"/>

  <line class="edge-sim" x1="440" y1="194" x2="261" y2="194" marker-end="url(#arrow-sim)"/>
  <text class="label-sim mono" x="350" y="184" text-anchor="middle">defines semantics</text>

  <path class="edge-sim dashed" d="M260,350 H538 Q550,350 550,338 V233" marker-end="url(#arrow-sim)"/>
  <text class="label-sim mono" x="538" y="300" text-anchor="end">verify</text>

  <!-- Model -->
  <rect class="box" x="40" y="24" width="220" height="76" rx="12"/>
  <text class="title" x="150" y="57">Model</text>
  <text class="sub" x="150" y="81">transformer</text>

  <!-- ISA -->
  <rect class="isa" x="40" y="156" width="220" height="76" rx="12"/>
  <g class="isa-text">
    <text class="title" x="150" y="189">Titania ISA</text>
    <text class="sub" x="150" y="213">instruction set</text>
  </g>

  <!-- ISA simulator -->
  <rect class="sim" x="440" y="156" width="220" height="76" rx="12"/>
  <g class="sim-text">
    <text class="title" x="550" y="189">ISA Simulator</text>
    <text class="sub" x="550" y="213">reference implementation</text>
  </g>

  <!-- GPU -->
  <rect class="box" x="40" y="312" width="220" height="76" rx="12"/>
  <text class="title" x="150" y="345">GPU</text>
  <text class="sub" x="150" y="369">RTL</text>

  <!-- FPGA, then ASIC -->
  <rect class="box" x="95" y="444" width="110" height="50" rx="25"/>
  <text class="pill" x="150" y="475">FPGA</text>
  <rect class="box" x="245" y="444" width="110" height="50" rx="25"/>
  <text class="pill" x="300" y="475">ASIC</text>
</svg>
